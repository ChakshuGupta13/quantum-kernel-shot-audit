<script>
document.addEventListener('DOMContentLoaded',async()=>{
await document.fonts.ready;
const data=JSON.parse(document.getElementById('recorded-data').textContent),root=document.getElementById('content');let chart=null,tab=0;
const esc=value=>String(value).replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
const number=(value,digits=3)=>Number(value).toFixed(digits),pct=value=>(100*value).toFixed(2)+'%';
document.title=data.title;document.getElementById('title').textContent=data.title;document.getElementById('subtitle').textContent=data.subtitle;
document.getElementById('eyebrow').textContent='GEORGIA TECH QISKIT FALL FEST 2026 / '+data.prompt;document.getElementById('repo').href=data.repository;
document.getElementById('limit').textContent=data.limit;document.getElementById('footer').textContent=data.data_credit+' | Code MIT | Recorded experiment';
document.getElementById('download').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),anchor=document.createElement('a');anchor.href=url;anchor.download='recorded-demo-data.json';anchor.click();URL.revokeObjectURL(url)};
const metric=(value,label)=>'<div class="metric"><strong>'+esc(value)+'</strong><span>'+esc(label)+'</span></div>';
document.getElementById('metrics').innerHTML=data.kind==='a'?metric('4','fixed classifier rows')+metric('256','shots per kernel pair')+metric('1,008','kernel circuits')+metric('16','shared test records'):metric('64','catalogue records')+metric('19','record-oracle qubits')+metric('2','measured search shots')+metric(number(data.run.process_wall_seconds,2)+' s','recorded process time');
const views=data.kind==='a'?[['Comparison','chart-column'],['Kernel matrices','grid-3x3'],['Evidence','table']]:[['Catalogue','scatter-chart'],['Recorded search','route'],['Cost ledger','scale']];
const tabs=document.getElementById('tabs');views.forEach(([name,icon],index)=>{const button=document.createElement('button');button.className='tab';button.setAttribute('role','tab');button.setAttribute('aria-selected',index===0);button.innerHTML='<i data-lucide="'+icon+'"></i>'+esc(name);button.onclick=()=>show(index);tabs.appendChild(button)});
Chart.defaults.font.family='Plex';Chart.defaults.color='#637070';Chart.defaults.animation=false;
function table(headers,rows){return '<div class="scroll"><table><thead><tr>'+headers.map(header=>'<th>'+esc(header)+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>'}
function matrix(canvas,values,output){const ctx=canvas.getContext('2d'),size=values.length,left=40,top=24,width=448,cell=width/size,stops=[[68,1,84],[59,82,139],[33,145,140],[94,201,98],[253,231,37]];ctx.fillStyle='white';ctx.fillRect(0,0,512,512);values.forEach((row,vertical)=>row.forEach((value,horizontal)=>{const coordinate=Math.max(0,Math.min(1,value))*4,index=Math.min(3,Math.floor(coordinate)),fraction=coordinate-index,color=stops[index].map((component,channel)=>Math.round(component+(stops[index+1][channel]-component)*fraction));ctx.fillStyle='rgb('+color.join(',')+')';ctx.fillRect(left+horizontal*cell,top+vertical*cell,cell+0.3,cell+0.3)}));ctx.fillStyle='#242929';ctx.font='12px Plex';for(const index of [0,8,16,24,31]){ctx.fillText(String(index),left+index*cell,top+width+18);ctx.fillText(String(index),12,top+index*cell+10)}ctx.fillText('Training column index',160,510);canvas.onmousemove=event=>{const box=canvas.getBoundingClientRect(),horizontal=Math.floor(((event.clientX-box.left)*512/box.width-left)/cell),vertical=Math.floor(((event.clientY-box.top)*512/box.height-top)/cell);if(horizontal>=0&&vertical>=0&&horizontal<size&&vertical<size)output.textContent='row '+vertical+' | column '+horizontal+' | fidelity '+number(values[vertical][horizontal],6)};output.textContent='Fidelity scale 0 to 1 | training row and column order';}
function compareA(){const methods=Object.keys(data.rows).sort((first,second)=>data.rows[second].metrics.balanced_accuracy-data.rows[first].metrics.balanced_accuracy);root.innerHTML='<div class="two"><div><h2>Four rows, one shared holdout</h2><div class="plot"><canvas id="plot" aria-label="Balanced accuracy of the four fixed classifiers"></canvas></div><p class="caption">Balanced accuracy, 0 to 100%. One split and seed, not a statistically established ranking.</p></div><div><h2>Recorded point estimates</h2>'+table(['Classifier','Balanced accuracy','ROC-AUC'],methods.map(method=>'<tr><td>'+esc(data.rows[method].label)+'</td><td class="number">'+pct(data.rows[method].metrics.balanced_accuracy)+'</td><td class="number">'+number(data.rows[method].metrics.roc_auc_from_decision_function,4)+'</td></tr>'))+'<p class="caption">Both quantum rows missed all six malignant test records. The ideal row also failed; shots alone are not a demonstrated explanation.</p></div></div>';chart=new Chart(document.getElementById('plot'),{type:'bar',data:{labels:methods.map(method=>data.rows[method].label),datasets:[{data:methods.map(method=>data.rows[method].metrics.balanced_accuracy),backgroundColor:methods.map(method=>method.startsWith('quantum')?'#087c80':'#535e61')}]},options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{min:0,max:1,ticks:{callback:value=>Math.round(value*100)+'%'}},y:{grid:{display:false}}}}});}
function kernelsA(){root.innerHTML='<div class="two"><div><h2>Ideal training kernel</h2><canvas class="matrix" id="ideal" width="512" height="512" aria-label="Ideal 32 by 32 training fidelity kernel"></canvas><output class="matrix-output" id="ideal-value"></output></div><div><h2>256-shot training kernel</h2><canvas class="matrix" id="shot" width="512" height="512" aria-label="Sampled 32 by 32 training fidelity kernel"></canvas><output class="matrix-output" id="shot-value"></output></div></div><p class="caption">Shared 32-record order and fidelity scale. Training relative Frobenius error 0.0687; test-to-training error 0.1185. Matrix error is not classification error.</p>';matrix(document.getElementById('ideal'),data.matrices.ideal,document.getElementById('ideal-value'));matrix(document.getElementById('shot'),data.matrices.shot,document.getElementById('shot-value'));}
function evidenceA(){root.innerHTML='<h2>Per-record predictions</h2><div class="toolbar"><label for="method">Classifier</label><select id="method">'+Object.keys(data.rows).map(method=>'<option value="'+method+'">'+esc(data.rows[method].label)+'</option>').join('')+'</select></div><div id="predictions"></div><div class="section"><h2>Bound evidence</h2><div class="evidence">'+data.evidence_links.map(name=>'<a href="'+esc(name)+'">'+esc(name)+'</a>').join('')+'</div></div>';const select=document.getElementById('method');const draw=()=>{document.getElementById('predictions').innerHTML=table(['Raw row ID','True class','Prediction','Decision score'],data.rows[select.value].records.map(item=>'<tr><td class="id">'+item.row_id+'</td><td>'+esc(item.label?'Malignant':'Benign')+'</td><td class="'+(item.prediction===item.label?'status':'miss')+'">'+esc(item.prediction?'Malignant':'Benign')+'</td><td class="number">'+number(item.decision_score,5)+'</td></tr>'))};select.onchange=draw;draw();}
function catalogueC(){root.innerHTML='<div class="two"><div><h2>Frozen earthquake catalogue</h2><div class="plot"><canvas id="plot" aria-label="Magnitude and depth of the 64 admitted earthquakes"></canvas></div><p class="caption">USGS first 64 events in the declared 2024 window, January 1-17. Diamond markers are predicate matches. Depth increases downward.</p></div><div><h2>Fixed record predicate</h2>'+table(['Quantity','Condition'],['<tr><td>Magnitude</td><td class="number">at least 6</td></tr>','<tr><td>Depth</td><td class="number">at most 70 km</td></tr>','<tr><td>Matching indices</td><td class="number">2, 22, 52</td></tr>'])+'<p class="caption">The source request admitted magnitude at least 5. It did not prefilter on the final depth or magnitude predicate.</p></div></div><div class="section"><h2>Indexed records</h2><div class="toolbar"><input id="query" type="search" aria-label="Search event ID or place" placeholder="Event ID or place"><select id="filter" aria-label="Match status"><option value="all">All records</option><option value="match">Predicate matches</option><option value="other">Other records</option></select></div><div id="catalogue-table"></div></div>';const datasets=[false,true].map(marked=>({label:marked?'Predicate match':'Other record',data:data.events.filter(event=>event.marked===marked).map(event=>({x:event.mag,y:event.depth,id:event.id,index:event.index})),backgroundColor:marked?'#087c80':'#9ba6a6',pointStyle:marked?'rectRot':'circle',pointRadius:marked?6:3}));datasets.push({type:'line',label:'Depth threshold',data:[{x:5,y:70},{x:8,y:70}],borderColor:'#b44b31',borderDash:[5,5],borderWidth:1,pointRadius:0});datasets.push({type:'line',label:'Magnitude threshold',data:[{x:6,y:0},{x:6,y:210}],borderColor:'#535e61',borderDash:[5,5],borderWidth:1,pointRadius:0});chart=new Chart(document.getElementById('plot'),{type:'scatter',data:{datasets},options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:context=>context.raw.id?context.raw.id+' | index '+context.raw.index+' | M '+context.raw.x+' | '+context.raw.y+' km':context.dataset.label}}},scales:{x:{min:5,max:8,title:{display:true,text:'Magnitude'}},y:{min:0,max:210,reverse:true,title:{display:true,text:'Depth (km)'}}}}});const draw=()=>{const query=document.getElementById('query').value.toLowerCase(),filter=document.getElementById('filter').value;const events=data.events.filter(event=>(event.id+' '+event.place).toLowerCase().includes(query)&&(filter==='all'||event.marked===(filter==='match')));document.getElementById('catalogue-table').innerHTML=table(['Index','Event ID','Magnitude','Depth km','Predicate','Place'],events.map(event=>'<tr><td class="number">'+event.index+'</td><td class="id">'+esc(event.id)+'</td><td class="number">'+esc(event.mag_text)+'</td><td class="number">'+esc(event.depth_text)+'</td><td class="'+(event.marked?'status':'')+'">'+(event.marked?'Match':'Other')+'</td><td>'+esc(event.place)+'</td></tr>'))};document.getElementById('query').oninput=draw;document.getElementById('filter').onchange=draw;draw();}
function searchC(){const attempts=data.run.progress.attempts;root.innerHTML='<h2>One verified event, two retained shots</h2>'+table(['Attempt','Grover iterations','Measured word','Index','Event','Verified'],attempts.map(attempt=>'<tr><td>'+attempt.attempt+'</td><td>'+attempt.grover_iterations+'</td><td class="id">'+esc(Object.keys(attempt.counts)[0])+'</td><td>'+attempt.candidate.index+'</td><td class="id">'+esc(attempt.candidate.event_id)+'</td><td class="'+(attempt.candidate.accepted?'status':'miss')+'">'+(attempt.candidate.accepted?'Match':'Miss')+'</td></tr>'))+'<div class="section two"><div><h2>Record-based phase oracle</h2>'+table(['Stage','Action'],['<tr><td>Load</td><td>Index to encoded magnitude and depth</td></tr>','<tr><td>Compare</td><td>Magnitude and depth flags</td></tr>','<tr><td>Phase</td><td>Sign flip only when both flags pass</td></tr>','<tr><td>Uncompute</td><td>Restore fields and flags to zero</td></tr>'])+'</div><div><h2>Execution contract</h2>'+table(['Recorded quantity','Value'],['<tr><td>Phase-oracle calls</td><td>1</td></tr>','<tr><td>Candidate checks</td><td>2</td></tr>','<tr><td>Post-capture checks</td><td>2</td></tr>','<tr><td>Process time</td><td>'+number(data.run.process_wall_seconds,2)+' s</td></tr>'])+'<p class="caption">The fixed schedule did not read the saved match count. First verified success stopped the run; one measurement returns one index.</p></div></div>';}
